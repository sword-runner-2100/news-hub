<!DOCTYPE html>
<html lang="zh-CN" data-view="auto">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover, maximum-scale=5.0">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="theme-color" content="#0B0E14">
<title>每日新闻汇总台 · 育碧 / Temu</title>
<!-- 本工作台通过 WorkBuddy 资料库能力（library skill）搭建、存储和部署 -->
<script>
(function(){
  try{
    var v = localStorage.getItem('wb_newshub_view_v1') || 'auto';
    var w = window.innerWidth;
    var isMobile = (v === 'mobile') || (v === 'auto' && w <= 768);
    document.documentElement.setAttribute('data-view', v);
    if(isMobile){ document.documentElement.classList.add('is-mobile'); }
  }catch(e){}
})();
</script>
<style>
:root{
  --bg:#0B0E14;
  --bg2:#0F131C;
  --panel:#141926;
  --panel2:#1A2030;
  --border:#232B3D;
  --border2:#2E384E;
  --t1:#E8ECF5;
  --t2:#9AA5BC;
  --t3:#68738C;
  --acc1:#7E8CFF;
  --acc2:#A66BFF;
  --grad:linear-gradient(135deg,#7E8CFF 0%,#A66BFF 100%);
  --emerald:#34D399;
  --emerald-dim:rgba(52,211,153,.14);
  --red:#FF5C6C;
  --red-dim:rgba(255,92,108,.13);
  --amber:#F5A524;
  --amber-dim:rgba(245,165,36,.13);
  --ubi:#7E8CFF;
  --ubi-dim:rgba(126,140,255,.14);
  --temu:#34D399;
  --temu-dim:rgba(52,211,153,.13);
  --r:14px;
  --r-s:10px;
  --shadow:0 8px 28px rgba(0,0,0,.42);
  --font:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,"PingFang SC","Hiragino Sans GB","Microsoft YaHei",sans-serif;
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;padding:0}
body{
  background:
    radial-gradient(1100px 520px at 12% -8%, rgba(126,140,255,.11), transparent 60%),
    radial-gradient(900px 460px at 92% 4%, rgba(166,107,255,.09), transparent 62%),
    var(--bg);
  color:var(--t1);
  font-family:var(--font);
  font-size:15px;
  line-height:1.65;
  -webkit-font-smoothing:antialiased;
  min-height:100vh;
}
a{color:inherit;text-decoration:none}
button{font-family:inherit;cursor:pointer;border:none;background:none;color:inherit}
input{font-family:inherit}
::-webkit-scrollbar{width:9px;height:9px}
::-webkit-scrollbar-track{background:transparent}
::-webkit-scrollbar-thumb{background:#2A3346;border-radius:9px}
::-webkit-scrollbar-thumb:hover{background:#3A465E}

/* ---------- 顶栏 ---------- */
.topbar{
  position:sticky;top:0;z-index:60;
  background:rgba(11,14,20,.82);
  backdrop-filter:saturate(180%) blur(18px);
  -webkit-backdrop-filter:saturate(180%) blur(18px);
  border-bottom:1px solid var(--border);
}
.topbar-in{
  max-width:1500px;margin:0 auto;padding:12px 22px;
  display:flex;align-items:center;gap:16px;
}
.brand{display:flex;align-items:center;gap:12px;min-width:0}
.logo{
  width:38px;height:38px;border-radius:11px;flex:none;
  background:var(--grad);
  display:flex;align-items:center;justify-content:center;
  box-shadow:0 5px 18px rgba(126,140,255,.34);
}
.logo svg{width:21px;height:21px;display:block}
.brand-txt{min-width:0}
.brand-txt h1{
  margin:0;font-size:17px;font-weight:700;letter-spacing:.3px;
  white-space:nowrap;overflow:hidden;text-overflow:ellipsis;
}
.brand-txt p{margin:1px 0 0;font-size:11.5px;color:var(--t3);letter-spacing:.4px}
.spacer{flex:1}

.sync{
  display:flex;align-items:center;gap:7px;
  padding:6px 12px;border-radius:999px;
  background:var(--emerald-dim);border:1px solid rgba(52,211,153,.28);
  font-size:12px;color:var(--emerald);white-space:nowrap;
}
.sync .dot{width:7px;height:7px;border-radius:50%;background:var(--emerald);animation:pulse 2s infinite}
.sync.off{background:var(--amber-dim);border-color:rgba(245,165,36,.3);color:var(--amber)}
.sync.off .dot{background:var(--amber)}
@keyframes pulse{0%,100%{opacity:1;transform:scale(1)}50%{opacity:.45;transform:scale(.82)}}

.iconbtn{
  width:38px;height:38px;border-radius:10px;flex:none;
  display:flex;align-items:center;justify-content:center;
  background:var(--panel);border:1px solid var(--border);
  color:var(--t2);transition:.18s;
}
.iconbtn:hover{background:var(--panel2);color:var(--t1);border-color:var(--border2)}
.iconbtn svg{width:17px;height:17px}
.iconbtn.on{background:var(--grad);color:#fff;border-color:transparent}

.viewswitch{
  display:flex;gap:2px;padding:3px;border-radius:11px;
  background:var(--panel);border:1px solid var(--border);
}
.viewswitch button{
  padding:6px 11px;border-radius:8px;font-size:12px;color:var(--t3);
  display:flex;align-items:center;gap:5px;transition:.16s;white-space:nowrap;
}
.viewswitch button svg{width:14px;height:14px}
.viewswitch button.on{background:var(--grad);color:#fff}
.viewswitch button:not(.on):hover{color:var(--t1)}

.menuwrap{position:relative}
.menu{
  position:absolute;right:0;top:46px;z-index:80;
  width:214px;padding:7px;border-radius:13px;
  background:var(--panel2);border:1px solid var(--border2);
  box-shadow:var(--shadow);display:none;
}
.menu.open{display:block}
.menu button{
  width:100%;display:flex;align-items:center;gap:10px;
  padding:10px 11px;border-radius:9px;font-size:13.5px;color:var(--t2);
  text-align:left;transition:.14s;
}
.menu button svg{width:16px;height:16px;flex:none}
.menu button:hover{background:#222A3C;color:var(--t1)}
.menu button.danger:hover{background:var(--red-dim);color:var(--red)}
.menu hr{border:none;border-top:1px solid var(--border);margin:6px 4px}

/* ---------- 主体框架 ---------- */
.wrap{max-width:1500px;margin:0 auto;padding:20px 22px 60px}
.layout{display:grid;grid-template-columns:288px minmax(0,1fr);gap:22px;align-items:start}

.btn{
  padding:8px 15px;border-radius:9px;font-size:13px;font-weight:600;
  background:var(--panel2);border:1px solid var(--border);color:var(--t2);transition:.16s;
  display:inline-flex;align-items:center;gap:7px;
}
.btn svg{width:15px;height:15px}
.btn:hover{border-color:var(--acc1);color:var(--t1)}
.btn.primary{background:var(--grad);color:#fff;border-color:transparent}
.btn.primary:hover{filter:brightness(1.1)}

/* ---------- 侧栏 ---------- */
.side{display:flex;flex-direction:column;gap:14px;position:sticky;top:82px}
.card{
  background:var(--panel);border:1px solid var(--border);
  border-radius:var(--r);padding:15px 16px;
}
.card h3{
  margin:0 0 12px;font-size:12px;font-weight:700;color:var(--t3);
  letter-spacing:1.1px;text-transform:uppercase;
  display:flex;align-items:center;gap:7px;
}
.card h3 svg{width:14px;height:14px}
.filters{display:flex;flex-direction:column;gap:7px}
.filt{
  display:flex;align-items:center;gap:10px;width:100%;
  padding:10px 12px;border-radius:var(--r-s);font-size:13.5px;color:var(--t2);
  border:1px solid transparent;transition:.16s;text-align:left;
}
.filt .sw{width:8px;height:8px;border-radius:50%;flex:none}
.filt .cnt{margin-left:auto;font-size:11.5px;color:var(--t3);font-variant-numeric:tabular-nums}
.filt:hover{background:var(--panel2);color:var(--t1)}
.filt.on{background:var(--panel2);border-color:var(--border2);color:var(--t1);font-weight:600}
.filt.on .cnt{color:var(--acc1)}
.filt svg{width:15px;height:15px;flex:none}

.searchbox{position:relative;margin-bottom:0}
.searchbox svg{
  position:absolute;left:12px;top:50%;transform:translateY(-50%);
  width:15px;height:15px;color:var(--t3);pointer-events:none;
}
.searchbox input{
  width:100%;padding:11px 13px 11px 35px;border-radius:var(--r-s);
  background:var(--bg2);border:1px solid var(--border);color:var(--t1);
  font-size:16px;outline:none;transition:.16s;
}
.searchbox input:focus{border-color:var(--acc1);background:var(--panel)}
.searchbox input::placeholder{color:var(--t3);font-size:13.5px}

.chart{margin-top:2px}
.chart svg{width:100%;height:auto;display:block;overflow:visible}
.legend{display:flex;gap:14px;margin-top:10px;font-size:11.5px;color:var(--t3)}
.legend span{display:flex;align-items:center;gap:5px}
.legend i{width:9px;height:9px;border-radius:3px;display:block}

.acts{display:flex;flex-direction:column;gap:7px}
.acts .btn{width:100%;justify-content:center}
.note{font-size:11.5px;color:var(--t3);line-height:1.6;margin-top:4px}

.backup-tip{
  display:none;align-items:center;gap:10px;
  padding:11px 14px;border-radius:var(--r-s);margin-bottom:16px;
  background:var(--amber-dim);border:1px solid rgba(245,165,36,.3);
  color:#FFD083;font-size:13px;
}
.backup-tip.show{display:flex}
.backup-tip svg{width:16px;height:16px;flex:none}
.backup-tip button{margin-left:auto;flex:none;padding:5px 11px;border-radius:8px;background:rgba(245,165,36,.2);color:#FFD083;font-size:12px;font-weight:600}

/* ---------- 时间线 ---------- */
.tl-head{
  display:flex;align-items:baseline;gap:11px;margin:0 0 15px;flex-wrap:wrap;
}
.tl-head h2{margin:0;font-size:16px;font-weight:700}
.tl-head .sub{font-size:12.5px;color:var(--t3)}
.daygroup{margin-bottom:26px}
.daybar{
  position:sticky;top:70px;z-index:30;
  display:flex;align-items:center;gap:11px;
  padding:7px 0 9px;margin-bottom:11px;
  background:linear-gradient(180deg,var(--bg) 62%,rgba(11,14,20,0));
}
.daybar .d{
  font-size:13px;font-weight:700;letter-spacing:.4px;
  padding:4px 11px;border-radius:8px;background:var(--panel);border:1px solid var(--border);
  font-variant-numeric:tabular-nums;
}
.daybar .d.today{background:var(--grad);border-color:transparent;color:#fff}
.daybar .rel{font-size:11.5px;color:var(--t3)}
.daybar .n{font-size:11.5px;color:var(--t3);margin-left:auto;font-variant-numeric:tabular-nums}
.daybar .line{flex:1;height:1px;background:var(--border);min-width:20px}

.grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:13px}

.item{
  background:var(--panel);border:1px solid var(--border);border-radius:var(--r);
  padding:15px 16px;position:relative;transition:.2s;display:flex;flex-direction:column;
  border-left:3px solid var(--border2);
}
.item:hover{border-color:var(--border2);transform:translateY(-2px);box-shadow:var(--shadow)}
.item.t-ubisoft{border-left-color:var(--ubi)}
.item.t-temu{border-left-color:var(--temu)}
.item.read{opacity:.52}
.item.read:hover{opacity:.82}
.item.starred{border-color:rgba(245,165,36,.42)}

.item-top{display:flex;align-items:center;gap:8px;margin-bottom:9px;flex-wrap:wrap}
.badge{
  font-size:10.5px;font-weight:700;padding:3px 9px;border-radius:6px;letter-spacing:.3px;flex:none;
}
.badge.b-ubisoft{background:var(--ubi-dim);color:var(--ubi)}
.badge.b-temu{background:var(--temu-dim);color:var(--temu)}
.cat{font-size:10.5px;color:var(--t3);padding:3px 8px;border-radius:6px;background:var(--bg2);border:1px solid var(--border);flex:none}
.item-acts{margin-left:auto;display:flex;gap:3px;flex:none}
.mini{
  width:28px;height:28px;border-radius:7px;display:flex;align-items:center;justify-content:center;
  color:var(--t3);transition:.15s;
}
.mini svg{width:15px;height:15px}
.mini:hover{background:var(--panel2);color:var(--t1)}
.mini.on{color:var(--amber)}
.mini.done{color:var(--emerald)}

.item h4{
  margin:0 0 8px;font-size:14.5px;font-weight:650;line-height:1.55;color:var(--t1);
  display:-webkit-box;-webkit-line-clamp:3;-webkit-box-orient:vertical;overflow:hidden;
}
.item.read h4{font-weight:500}
.item p{
  margin:0 0 12px;font-size:12.8px;color:var(--t2);line-height:1.68;
  display:-webkit-box;-webkit-line-clamp:4;-webkit-box-orient:vertical;overflow:hidden;
}
.meta{display:flex;align-items:center;gap:9px;flex-wrap:wrap;font-size:11.5px;color:var(--t3);margin-top:auto;padding-top:11px;border-top:1px solid var(--border)}
.meta .src{
  color:var(--t2);font-weight:600;max-width:150px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;
}
.meta .sep{width:3px;height:3px;border-radius:50%;background:var(--t3);flex:none}
.meta .time{font-variant-numeric:tabular-nums}
.linkbtn{
  margin-left:auto;flex:none;display:inline-flex;align-items:center;gap:5px;
  padding:5px 11px;border-radius:8px;font-size:11.5px;font-weight:600;
  background:var(--bg2);border:1px solid var(--border);color:var(--t2);transition:.16s;
}
.linkbtn svg{width:12px;height:12px}
.linkbtn:hover{background:var(--grad);color:#fff;border-color:transparent}

.empty{
  text-align:center;padding:64px 20px;color:var(--t3);
}
.empty svg{width:46px;height:46px;opacity:.35;margin-bottom:14px}
.empty p{margin:0;font-size:14px}

/* ---------- 移动端 ---------- */
html.is-mobile .wrap{padding:14px 14px calc(84px + env(safe-area-inset-bottom))}
html.is-mobile .topbar-in{padding:10px 14px;gap:10px}
html.is-mobile .brand-txt h1{font-size:15.5px}
html.is-mobile .brand-txt p{display:none}
html.is-mobile .logo{width:34px;height:34px;border-radius:10px}
html.is-mobile .sync span{display:none}
html.is-mobile .sync{padding:8px 10px}
html.is-mobile .layout{display:flex;flex-direction:column;gap:14px}
html.is-mobile .side{position:static;gap:12px;order:1}
html.is-mobile .main{order:2}
html.is-mobile .grid{grid-template-columns:1fr;gap:11px}
html.is-mobile .daybar{top:58px;padding:6px 0 8px}
html.is-mobile .filters{
  flex-direction:row;gap:8px;overflow-x:auto;-webkit-overflow-scrolling:touch;
  padding-bottom:2px;scrollbar-width:none;
}
html.is-mobile .filters::-webkit-scrollbar{display:none}
html.is-mobile .filt{
  flex:none;width:auto;padding:9px 14px;border-radius:999px;
  background:var(--bg2);border:1px solid var(--border);min-height:40px;
}
html.is-mobile .filt .cnt{display:none}
html.is-mobile .filt.on{background:var(--grad);border-color:transparent;color:#fff}
html.is-mobile .filt.on .cnt{display:inline;color:rgba(255,255,255,.75)}
html.is-mobile .searchbox input{font-size:16px;padding:12px 13px 12px 35px}
html.is-mobile .acts{flex-direction:row;flex-wrap:wrap}
html.is-mobile .acts .btn{width:auto;flex:1 1 46%;min-height:44px;justify-content:center}
html.is-mobile .card{padding:13px 14px}
html.is-mobile .item{padding:14px 14px}
html.is-mobile .item h4{font-size:15px;-webkit-line-clamp:4}
html.is-mobile .item p{font-size:13px;-webkit-line-clamp:5}
html.is-mobile .mini{width:36px;height:36px}
html.is-mobile .mini svg{width:17px;height:17px}
html.is-mobile .linkbtn{padding:8px 13px;font-size:12.5px;min-height:36px}
html.is-mobile .meta .src{max-width:110px}
html.is-mobile .tl-head h2{font-size:15px}
html.is-mobile .note{display:none}
html.is-mobile .chart svg{height:110px}

/* ---------- Steam 在线人数 ---------- */
.steam-panel{
  background:linear-gradient(150deg,rgba(52,211,153,.08),rgba(126,140,255,.05) 55%,transparent);
  border:1px solid rgba(52,211,153,.2);
  border-radius:var(--r);padding:18px 20px;margin-bottom:20px;position:relative;overflow:hidden;
}
.steam-panel::before{content:"";position:absolute;left:0;top:0;bottom:0;width:3px;background:linear-gradient(180deg,#34D399,#7E8CFF)}
.steam-head{display:flex;align-items:center;gap:11px;flex-wrap:wrap;margin-bottom:14px}
.steam-head h2{margin:0;font-size:15.5px;font-weight:700;display:flex;align-items:center;gap:8px}
.steam-head h2 svg{width:17px;height:17px;color:var(--emerald)}
.steam-head .upd{margin-left:auto;font-size:12px;color:var(--t3);font-variant-numeric:tabular-nums}
.steam-head .upd b{color:var(--t2);font-weight:600}

/* 每个游戏一个独立区块：头部指标 + 自己的折线图 + 自己的日度表 */
.gpanels{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:13px}
.gpanel{
  background:var(--panel);border:1px solid var(--border);
  border-radius:var(--r);overflow:hidden;display:flex;flex-direction:column;
}
.gpanel .gp-head{display:flex;align-items:flex-start;gap:10px;padding:13px 15px;border-bottom:1px solid var(--border)}
.gpanel .gp-bar{height:3px;flex:none}
.gavatar{
  width:34px;height:34px;border-radius:9px;flex:none;
  display:flex;align-items:center;justify-content:center;font-size:12.5px;font-weight:800;color:#fff;
}
.gtitle{min-width:0;flex:1}
.gtitle .n{font-size:14px;font-weight:700;line-height:1.35;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.gtitle .s{font-size:11px;color:var(--t3);margin-top:1px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.gkpis{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;padding:12px 15px 0}
.gkpi{background:rgba(255,255,255,.035);border:1px solid var(--border);border-radius:9px;padding:8px 10px}
.gkpi .n{font-size:17px;font-weight:700;line-height:1.2;font-variant-numeric:tabular-nums}
.gkpi .l{font-size:10.5px;color:var(--t3);margin-top:1px;white-space:nowrap}
.gkpi.live .n{color:var(--emerald)}
.gkpi.d24 .n{color:var(--amber)}
.gkpi.atp .n{color:var(--acc1)}
.livedot{display:inline-block;width:6px;height:6px;border-radius:50%;background:var(--emerald);margin-right:5px;vertical-align:middle;animation:pulse 2s infinite}

.gp-chart{padding:13px 12px 4px;position:relative}
.gp-chart svg{width:100%;height:auto;display:block;overflow:visible}
.gp-chart circle[data-d]{cursor:pointer}
.gp-chart circle[data-d]:hover{stroke-width:3}
.gp-note{font-size:11px;color:var(--t3);padding:2px 15px 12px;display:flex;gap:5px;flex-wrap:wrap}

/* 悬浮数据气泡 */
.gtip{
  position:absolute;z-index:20;left:0;top:0;
  transform:translate(-50%,-100%) translateY(-10px);
  background:rgba(16,21,32,.97);border:1px solid var(--border2);
  border-radius:10px;padding:8px 11px;pointer-events:none;
  box-shadow:0 10px 26px rgba(0,0,0,.5);
  opacity:0;transition:opacity .13s;white-space:nowrap;
}
.gtip.on{opacity:1}
.gtip .gt-d{font-size:11.5px;font-weight:700;color:var(--t1);margin-bottom:5px;padding-bottom:5px;border-bottom:1px solid var(--border)}
.gtip .gt-d span{color:var(--t3);font-weight:400;margin-left:5px}
.gtip .gt-r{display:flex;align-items:center;gap:14px;font-size:11.5px;line-height:1.7}
.gtip .gt-r span{color:var(--t3)}
.gtip .gt-r b{margin-left:auto;color:var(--t1);font-variant-numeric:tabular-nums}
.gtip .gt-r b.hl{color:var(--acc1)}
.gtip::after{
  content:"";position:absolute;left:50%;bottom:-5px;width:9px;height:9px;
  transform:translateX(-50%) rotate(45deg);
  background:rgba(16,21,32,.97);
  border-right:1px solid var(--border2);border-bottom:1px solid var(--border2);
}
.srcnote{font-size:11.5px;color:var(--t3);margin-top:11px;display:flex;align-items:center;gap:6px;flex-wrap:wrap}
.srcnote a{color:var(--t2);text-decoration:underline;text-decoration-color:var(--border2)}
.srcnote a:hover{color:var(--acc1)}

html.is-mobile .steam-panel{padding:15px 14px;margin-bottom:14px}
html.is-mobile .gpanels{grid-template-columns:1fr;gap:11px}
html.is-mobile .gkpi .n{font-size:16px}

/* 底部 Tab（移动端） */
.tabbar{display:none}
html.is-mobile .tabbar{
  display:flex;position:fixed;left:0;right:0;bottom:0;z-index:70;
  background:rgba(15,19,28,.94);
  backdrop-filter:saturate(180%) blur(18px);
  -webkit-backdrop-filter:saturate(180%) blur(18px);
  border-top:1px solid var(--border);
  padding:6px 6px calc(6px + env(safe-area-inset-bottom));
}
html.is-mobile .tabbar button{
  flex:1;display:flex;flex-direction:column;align-items:center;gap:3px;
  padding:7px 2px;border-radius:10px;font-size:10.5px;color:var(--t3);min-height:50px;
  transition:.15s;
}

/* ---------------- 数据层 ---------------- */
function readJSON(k, fb){ try{ const s=localStorage.getItem(k); return s?JSON.parse(s):fb; }catch(e){ return fb; } }
function writeJSON(k, v){ try{ localStorage.setItem(k, JSON.stringify(v)); return true; }catch(e){ return false; } }

function loadItems(){
  const stored = readJSON(K.items, null);
  if(!stored || !Array.isArray(stored.items)){
    writeJSON(K.items, {version:DATA_VERSION, items:SEED_DATA});
    return SEED_DATA.slice();
  }
  if(String(DATA_VERSION) > String(stored.version || "")){
    const map = new Map();
    (stored.items||[]).forEach(i=>{ if(i && i.id) map.set(i.id, i); });
    let added = 0;
    SEED_DATA.forEach(i=>{ if(i && i.id && !map.has(i.id)){ map.set(i.id, i); added++; } });
    const merged = Array.from(map.values());
    writeJSON(K.items, {version:DATA_VERSION, items:merged});
    if(added) setTimeout(()=>toast("已同步 " + added + " 条新新闻"), 700);
    return merged;
  }
  return stored.items || [];
}
function saveItems(list){ writeJSON(K.items, {version:DATA_VERSION, items:list}); }

let ITEMS = loadItems();
let STATE = readJSON(K.state, {read:{}, star:{}});
if(!STATE.read) STATE.read = {};
if(!STATE.star) STATE.star = {};
function saveState(){ writeJSON(K.state, STATE); }

/* ---------------- 工具 ---------------- */
function todayStr(){ const d=new Date(); return d.getFullYear()+"-"+String(d.getMonth()+1).padStart(2,"0")+"-"+String(d.getDate()).padStart(2,"0"); }
function esc(s){ return String(s==null?"":s).replace(/[&<>"']/g, c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c])); }
function dayOffset(ds){
  const t = todayStr();
  if(ds === t) return 0;
  const a = new Date(t+"T00:00:00"), b = new Date(ds+"T00:00:00");
  return Math.round((a-b)/86400000);
}
function relLabel(ds){
  const o = dayOffset(ds);
  if(o === 0) return "今天";
  if(o === 1) return "昨天";
  if(o === 2) return "前天";
  if(o > 0) return o + " 天前";
  return "未来";
}
function fmtDate(ds){
  const p = String(ds).split("-");
  return p.length===3 ? (p[1]*1)+"月"+(p[2]*1)+"日" : ds;
}
function hostOf(u){ try{ return new URL(u).hostname.replace(/^www\./,""); }catch(e){ return ""; } }
let toastTimer=null;
function toast(msg){
  const el = document.getElementById("toast");
  el.textContent = msg; el.classList.add("show");
  clearTimeout(toastTimer);
  toastTimer = setTimeout(()=>el.classList.remove("show"), 2100);
}

function renderFilters(){

    {k:"all", n:"全部新闻", c:"linear-gradient(135deg,#7E8CFF,#A66BFF)"},

    {k:"temu", n:TOPICS.temu.name, c:TOPICS.temu.color},

  ];

    '<button class="filt'+(FILTER===r.k?' on':'')+'" data-topic="'+r.k+'">'+
      '<i class="sw" style="background:'+r.c+'"></i>'+esc(r.n)+

    '</button>'
  ).join("");
  document.querySelectorAll("#tabbar button").forEach(b=>b.classList.toggle("on", b.dataset.topic===FILTER));
}

function renderChart(){
  const days = [];
  for(let i=6;i>=0;i--){ const d=new Date(); d.setDate(d.getDate()-i); days.push(d.getFullYear()+"-"+String(d.getMonth()+1).padStart(2,"0")+"-"+String(d.getDate()).padStart(2,"0")); }
  const data = days.map(d=>({
    d,
    u: ITEMS.filter(i=>i.date===d && i.topic==="ubisoft").length,
    t: ITEMS.filter(i=>i.date===d && i.topic==="temu").length
  }));
  const max = Math.max(3, ...data.map(x=>x.u+x.t));
  const W=280, H=140, pad=22, bw=16, gap=(W-pad*2-bw*7)/6;
  let bars = "";
  data.forEach((x,i)=>{
    const cx = pad + i*(bw+gap);
    const hu = (x.u/max)*(H-40), ht = (x.t/max)*(H-40);
    const base = H-24;
    bars += '<rect x="'+cx+'" y="'+(base-hu-ht)+'" width="'+bw+'" height="'+Math.max(x.u?2:0,hu)+'" rx="3" fill="#7E8CFF" opacity="'+(x.u?.92:.18)+'"><title>'+x.d+' 育碧 '+x.u+' 条</title></rect>';
    bars += '<rect x="'+cx+'" y="'+(base-ht)+'" width="'+bw+'" height="'+Math.max(x.t?2:0,ht)+'" rx="3" fill="#34D399" opacity="'+(x.t?.92:.18)+'"><title>'+x.d+' Temu '+x.t+' 条</title></rect>';
    if(x.u+x.t>0){ bars += '<text x="'+(cx+bw/2)+'" y="'+(base-hu-ht-6)+'" fill="#9AA5BC" font-size="9.5" text-anchor="middle" font-family="'+"-apple-system,sans-serif"+'">'+(x.u+x.t)+'</text>'; }
    const lab = x.d.slice(5).replace("-","/");
    bars += '<text x="'+(cx+bw/2)+'" y="'+(H-8)+'" fill="#68738C" font-size="9" text-anchor="middle" font-family="'+"-apple-system,sans-serif"+'">'+lab+'</text>';
  });
  let gl = "";
  for(let i=0;i<=3;i++){ const y=(H-24)-((H-40)/3)*i; gl += '<line x1="'+pad+'" y1="'+y+'" x2="'+(W-pad+6)+'" y2="'+y+'" stroke="#232B3D" stroke-width="1"/>'; }
  document.getElementById("chart").innerHTML =
    '<svg viewBox="0 0 '+W+' '+H+'" preserveAspectRatio="xMidYMid meet">'+gl+bars+'</svg>';
}

function renderTimeline(){
  const q = QUERY.trim().toLowerCase();
  let list = ITEMS.slice();
  if(FILTER === "star") list = list.filter(i=>STATE.star[i.id]);
  else if(FILTER !== "all") list = list.filter(i=>i.topic===FILTER);
  if(q) list = list.filter(i =>
    String(i.title||"").toLowerCase().includes(q) ||
    String(i.summary||"").toLowerCase().includes(q) ||
    String(i.source||"").toLowerCase().includes(q) ||
    String(i.cat||"").toLowerCase().includes(q)
  );
  list.sort((a,b)=>{
    if(a.date !== b.date) return a.date < b.date ? 1 : -1;
    const au = STATE.read[a.id] ? 1 : 0, bu = STATE.read[b.id] ? 1 : 0;
    if(au !== bu) return au - bu;
    return String(b.pubDate||"").localeCompare(String(a.pubDate||""));
  });

  document.getElementById("tlSub").textContent =
    "共 " + list.length + " 条 · 覆盖 " + new Set(list.map(i=>i.date)).size + " 天 · 最新置顶，向下滚动看往期";

  const el = document.getElementById("timeline");
  if(!list.length){
    el.innerHTML = '<div class="empty"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="11" cy="11" r="7"/><path d="M20 20l-3.5-3.5"/></svg><p>没有匹配的新闻，换个关键词或话题试试</p></div>';
    return;
  }

  const groups = {};
  list.forEach(i=>{ (groups[i.date] = groups[i.date] || []).push(i); });
  const dates = Object.keys(groups).sort().reverse();

  el.innerHTML = dates.map(d=>{
    const arr = groups[d];
    const o = dayOffset(d);
    const unread = arr.filter(i=>!STATE.read[i.id]).length;
    return '<section class="daygroup">'+
      '<div class="daybar">'+
        '<span class="d'+(o===0?' today':'')+'">'+fmtDate(d)+'</span>'+
        '<span class="rel">'+relLabel(d)+'</span>'+
        '<span class="line"></span>'+
        '<span class="n">'+arr.length+' 条'+(unread?' · '+unread+' 未读':'')+'</span>'+
      '</div>'+
      '<div class="grid">' + arr.map(cardHTML).join("") + '</div>'+
    '</section>';
  }).join("");
}

function cardHTML(i){
  const tp = TOPICS[i.topic] || {short:"—", color:"#68738C", name:"其他"};
  const read = !!STATE.read[i.id];
  const star = !!STATE.star[i.id];
  const host = hostOf(i.url);
  return '<article class="item t-'+esc(i.topic)+(read?' read':'')+(star?' starred':'')+'" data-id="'+esc(i.id)+'">'+
    '<div class="item-top">'+
      '<span class="badge b-'+esc(i.topic)+'" style="background:'+tp.color+'22;color:'+tp.color+'">'+esc(tp.short)+'</span>'+
      (i.cat?'<span class="cat">'+esc(i.cat)+'</span>':'')+
      '<div class="item-acts">'+
        '<button class="mini'+(star?' on':'')+'" data-star="'+esc(i.id)+'" title="星标">'+
          '<svg viewBox="0 0 24 24" fill="'+(star?'currentColor':'none')+'" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M12 3l2.7 5.6 6.1.9-4.4 4.3 1 6.1-5.4-2.9-5.4 2.9 1-6.1L3.2 9.5l6.1-.9z"/></svg>'+
        '</button>'+
        '<button class="mini'+(read?' done':'')+'" data-read="'+esc(i.id)+'" title="'+(read?'标记未读':'标记已读')+'">'+
          '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M20 6L9 17l-5-5"/></svg>'+
        '</button>'+
      '</div>'+
    '</div>'+
    '<h4>'+esc(i.title)+'</h4>'+
    '<p>'+esc(i.summary)+'</p>'+
    '<div class="meta">'+
      '<span class="src">'+esc(i.source||host||"未知来源")+'</span>'+
      '<span class="sep"></span>'+
      '<span class="time">'+(i.pubDate? esc(i.pubDate)+' 发布' : '时间不详')+'</span>'+
      (i.url?'<a class="linkbtn" href="'+esc(i.url)+'" target="_blank" rel="noopener noreferrer">'+
        '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M18 13v6a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2V8a2 2 0 0 1 2-2h6"/><path d="M15 3h6v6M10 14L21 3"/></svg>原文</a>':'')+
    '</div>'+
  '</article>';
}

/* ---------------- Steam 在线人数 ---------------- */
function fmtN(n){ return (n===null || n===undefined) ? "—" : Number(n).toLocaleString("en-US"); }

function renderSteam(){
  const games = STEAM_DATA.games || [];
  const panel = document.querySelector(".steam-panel");
  if(!games.length){ if(panel) panel.style.display = "none"; return; }

  const u = String(STEAM_DATA.updatedAt || "").replace("T", " ");
  document.getElementById("steamUpd").innerHTML = "数据更新于 <b>" + (u || "—") + "</b>";

  document.getElementById("gpanels").innerHTML =
    games.map((g,i)=>gamePanelHTML(g, i)).join("");
  bindChartTips();
}

function gamePanelHTML(g, i){
  const c = GCOLORS[i % GCOLORS.length];
  const asc = (g.daily||[]).slice().sort((a,b)=> a.date < b.date ? -1 : 1);
  const days = asc.map(d=>d.date);

  return '<section class="gpanel">'+
    '<div class="gp-bar" style="background:linear-gradient(90deg,'+c+','+c+'55)"></div>'+
    '<div class="gp-head">'+
      '<div class="gavatar" style="background:linear-gradient(135deg,'+c+','+c+'99)">'+esc(g.abbr||"?")+'</div>'+
      '<div class="gtitle">'+
        '<div class="n">'+esc(g.nameCn || g.name)+'</div>'+
        '<div class="s">'+esc(g.name)+' · App '+esc(g.appId)+' · '+esc(g.dev||"")+'</div>'+
      '</div>'+
    '</div>'+
    '<div class="gkpis">'+
      '<div class="gkpi live"><div class="n"><span class="livedot"></span>'+fmtN(g.current)+'</div><div class="l">当前在线</div></div>'+
      '<div class="gkpi d24"><div class="n">'+fmtN(g.peak24h)+'</div><div class="l">24 小时峰值</div></div>'+
      '<div class="gkpi atp"><div class="n">'+fmtN(g.allTimePeak)+'</div><div class="l">历史峰值'+(g.allTimePeakDate?' '+esc(String(g.allTimePeakDate).replace("-","/")):'')+'</div></div>'+
    '</div>'+
    '<div class="gp-chart">'+gameChartSVG(g, asc, c)+'<div class="gtip"></div></div>'+
    '<div class="gp-note">'+gameNoteHTML(g, days)+'</div>'+
  '</section>';
}

/* 单个游戏的折线图，X 轴为该游戏自己的日期序列 */
function gameChartSVG(g, asc, c){
  if(!asc || asc.length < 2){
    return '<div style="color:var(--t3);font-size:12.5px;padding:22px 0;text-align:center">日度数据不足，无法绘制</div>';
  }
  const W=560, H=190, pl=46, pr=16, pt=14, pb=28;
  const raw = Math.max.apply(null, asc.map(d=>d.peak).concat([1]));
  const mag = Math.pow(10, String(Math.floor(raw)).length - 2) || 1000;
  const yMax = Math.ceil(raw / (mag*2)) * (mag*2) || 1;
  const X = i => pl + (W-pl-pr) * i / (asc.length-1);
  const Y = v => pt + (H-pt-pb) * (1 - v/yMax);

  let grid = "", labels = "";
  for(let k=0;k<=4;k++){
    const v = yMax/4*k, y = Y(v);
    grid += '<line x1="'+pl+'" y1="'+y.toFixed(1)+'" x2="'+(W-pr)+'" y2="'+y.toFixed(1)+'" stroke="#232B3D" stroke-width="1"/>';
    labels += '<text x="'+(pl-7)+'" y="'+(y+3.5).toFixed(1)+'" fill="#68738C" font-size="9" text-anchor="end" font-family="-apple-system,sans-serif">'+(v>=10000?(v/1000)+"k":fmtN(v))+'</text>';
  }

  let axis = "", dots = "";
  asc.forEach((d,i)=>{
    const isLast = i === asc.length-1;
    axis += '<text x="'+X(i).toFixed(1)+'" y="'+(H-9)+'" fill="'+(isLast?"#9AA5BC":"#68738C")+'" font-size="9.5" text-anchor="middle" font-weight="'+(isLast?"700":"400")+'" font-family="-apple-system,sans-serif">'+d.date.slice(5).replace("-","/")+'</text>';
    dots += '<circle cx="'+X(i).toFixed(1)+'" cy="'+Y(d.peak).toFixed(1)+'" r="'+(isLast?4.5:3.4)+'"'+
      ' fill="'+(isLast?"#0B0E14":c)+'" stroke="'+c+'" stroke-width="'+(isLast?2.4:1.8)+'"'+
      ' data-d="'+esc(d.date)+'" data-p="'+d.peak+'" data-a="'+(d.avg==null?"":d.avg)+'" data-n="'+(d.n||"")+'">'+
      '<title>'+esc(g.abbr||g.name)+' · '+d.date+'\n峰值 '+fmtN(d.peak)+'\n日均 '+fmtN(d.avg)+(d.n?'\n采样 '+d.n+' 次':'')+'</title></circle>';
  });

  const pts = asc.map((d,i)=>({x:X(i), y:Y(d.peak)}));
  const dAll = pts.map((p,k)=>(k?"L":"M")+p.x.toFixed(1)+" "+p.y.toFixed(1)).join(" ");
  const area = dAll + " L"+pts[pts.length-1].x.toFixed(1)+" "+(H-pb)+" L"+pts[0].x.toFixed(1)+" "+(H-pb)+" Z";
  const solid = pts.slice(0, pts.length-1)
    .map((p,k)=>(k?"L":"M")+p.x.toFixed(1)+" "+p.y.toFixed(1)).join(" ");
  const a = pts[pts.length-2], b = pts[pts.length-1];
  const dash = "M"+a.x.toFixed(1)+" "+a.y.toFixed(1)+" L"+b.x.toFixed(1)+" "+b.y.toFixed(1);
  const last = asc[asc.length-1];
  const valueLabel = '<text x="'+(b.x-7)+'" y="'+(b.y-9)+'" fill="'+c+'" font-size="11" text-anchor="end" font-weight="700" font-family="-apple-system,sans-serif">'+fmtN(last.peak)+'</text>';

  return '<svg viewBox="0 0 '+W+' '+H+'" preserveAspectRatio="xMidYMid meet">'+
    grid+labels+
    '<path d="'+area+'" fill="'+c+'" opacity="0.09"/>'+
    '<path d="'+solid+'" fill="none" stroke="'+c+'" stroke-width="2.2" stroke-linejoin="round" stroke-linecap="round"/>'+
    '<path d="'+dash+'" fill="none" stroke="'+c+'" stroke-width="2.2" stroke-dasharray="4 4" stroke-linecap="round"/>'+
    axis+dots+valueLabel+
  '</svg>';
}

function gameNoteHTML(g, days){
  const last = days[days.length-1];
  const hit = (g.daily||[]).find(x=>x.date===last);
  const n = hit && hit.n ? hit.n : null;
  return '<span>过去 '+days.length+' 天每日峰值 · 鼠标悬停圆点看当天数据</span>'+
    '<span>· 末段虚线 = '+last.slice(5).replace("-","/")+' 未走完'+(n?'（采样 '+n+' 次）':'')+'</span>';
}

/* ---------------- 图表悬浮气泡 ---------------- */
const WK = ["日","一","二","三","四","五","六"];
function hideTips(){
  document.querySelectorAll("#gpanels .gtip.on").forEach(t=>t.classList.remove("on"));
}
function showTip(circle){
  const wrap = circle.closest ? circle.closest(".gp-chart") : null;
  if(!wrap) return;
  const tip = wrap.querySelector(".gtip");
  if(!tip) return;
  const d = circle.getAttribute("data-d") || "";
  const p = circle.getAttribute("data-p");
  const a = circle.getAttribute("data-a");
  const n = circle.getAttribute("data-n");
  const wk = d ? "周" + WK[new Date(d+"T00:00:00Z").getUTCDay()] : "";
  tip.innerHTML =
    '<div class="gt-d">'+esc(d.slice(5).replace("-","/"))+'<span>'+esc(wk)+'</span></div>'+
    '<div class="gt-r"><span>峰值</span><b class="hl">'+fmtN(p)+'</b></div>'+
    (a !== null && a !== "" ? '<div class="gt-r"><span>日均</span><b>'+fmtN(a)+'</b></div>' : '')+
    (n ? '<div class="gt-r"><span>采样</span><b>'+esc(n)+' 次</b></div>' : '');
  tip.classList.add("on");
  const cr = circle.getBoundingClientRect();
  const wr = wrap.getBoundingClientRect();
  const half = (tip.offsetWidth || 130) / 2;
  let x = cr.left - wr.left + cr.width / 2;
  x = Math.max(half + 4, Math.min(wr.width - half - 4, x));
  tip.style.left = x + "px";
  tip.style.top = (cr.top - wr.top) + "px";
}
function bindChartTips(){
  const gp = document.getElementById("gpanels");
  if(!gp || gp.dataset.tipbound === "1") return;
  gp.dataset.tipbound = "1";
  const pick = e => {
    const t = e.target;
    return (t && t.closest) ? t.closest("circle[data-d]") : null;
  };
  gp.addEventListener("mouseover", e=>{ const c = pick(e); if(c) showTip(c); });
  gp.addEventListener("mouseout",  e=>{ const c = pick(e); if(c) hideTips(); });
  gp.addEventListener("click",     e=>{ const c = pick(e); if(c) showTip(c); else hideTips(); });
  window.addEventListener("scroll", hideTips, true);
}

function renderAll(){ renderFilters(); renderChart(); renderSteam(); renderTimeline(); renderBackupTip(); }

function renderBackupTip(){
  const n = ITEMS.length;
  const el = document.getElementById("backupTip");
  if(n >= 30){
    el.classList.add("show");
    document.getElementById("backupTipTxt").textContent = "数据已积累 " + n + " 条，建议导出一份备份留存。";
  } else el.classList.remove("show");
}

/* ---------------- 交互 ---------------- */
document.addEventListener("click", e=>{
  const rb = e.target.closest("[data-read]");
  if(rb){
    const id = rb.dataset.read;
    const item = ITEMS.find(i=>i.id===id);
    if(STATE.read[id]) delete STATE.read[id]; else STATE.read[id] = 1;
    saveState(); renderAll();
    if(item && item.url && !STATE.read[id]) {} 
    if(item && item.url && STATE.read[id]) {}
    return;
  }
  const sb = e.target.closest("[data-star]");
  if(sb){
    const id = sb.dataset.star;
    if(STATE.star[id]) delete STATE.star[id]; else STATE.star[id] = 1;
    saveState(); renderAll();
    return;
  }
  const fb = e.target.closest("[data-topic]");
  if(fb && (fb.closest("#filters") || fb.closest("#tabbar"))){
    FILTER = fb.dataset.topic; renderFilters(); renderTimeline();
    if(fb.closest("#tabbar")) window.scrollTo({top:0, behavior:"smooth"});
    return;
  }
  const mb = e.target.closest("[data-act]");
  if(mb){ handleAction(mb.dataset.act); document.getElementById("menu").classList.remove("open"); return; }
});

document.getElementById("menuBtn").addEventListener("click", e=>{
  e.stopPropagation();
  document.getElementById("menu").classList.toggle("open");
});
document.addEventListener("click", ()=>document.getElementById("menu").classList.remove("open"));

const qEl = document.getElementById("q");
let qTimer=null;
qEl.addEventListener("input", ()=>{ clearTimeout(qTimer); qTimer=setTimeout(()=>{ QUERY=qEl.value; renderTimeline(); }, 180); });

const ICON_DESKTOP = '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="2" y="4" width="20" height="13" rx="2"/><path d="M8 21h8M12 17v4"/></svg>';
const ICON_MOBILE  = '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="6" y="2" width="12" height="20" rx="3"/><path d="M11 18h2"/></svg>';

function storedView(){ return localStorage.getItem(K.view) || "auto"; }
function effectiveView(){
  const v = storedView();
  if(v === "mobile" || v === "desktop") return v;
  return window.innerWidth <= 768 ? "mobile" : "desktop";
}
/* 布局状态单一来源：同步 is-mobile 类 + 顶栏两个切换控件。
   宽屏三档开关亮对应项；窄屏单键显示「点一下会切到哪种布局」的图标。 */
function syncViewUI(){
  const v = storedView();
  const cur = effectiveView();
  document.documentElement.classList.toggle("is-mobile", cur === "mobile");
  document.querySelectorAll("#viewswitch button").forEach(x=>x.classList.toggle("on", x.dataset.v===v));
  const btn = document.getElementById("viewToggle");
  if(!btn) return;
  btn.classList.toggle("auto", v === "auto");
  const toDesktop = (cur === "mobile");
  btn.innerHTML = '<span class="auto-dot"></span>' + (toDesktop ? ICON_DESKTOP : ICON_MOBILE);
  const label = toDesktop ? "切换到电脑版布局" : "切换到手机版布局";
  btn.setAttribute("aria-label", label);
  btn.setAttribute("title", v === "auto" ? label + "（当前为自动模式）" : label);
}
function setView(v, silent){
  localStorage.setItem(K.view, v);
  document.documentElement.setAttribute("data-view", v);
  syncViewUI();
  if(!silent) toast(v==="auto" ? "自动模式：按屏幕宽度切换" : (v==="desktop" ? "已锁定电脑版布局" : "已锁定手机版布局"));
}

document.getElementById("viewswitch").addEventListener("click", e=>{
  const b = e.target.closest("button"); if(!b) return;
  setView(b.dataset.v);
});
document.getElementById("viewToggle").addEventListener("click", ()=>{
  setView(effectiveView() === "mobile" ? "desktop" : "mobile");
});

let rzTimer=null;
window.addEventListener("resize", ()=>{
  clearTimeout(rzTimer);
  rzTimer = setTimeout(()=>{
    if(storedView() === "auto") setView("auto", true); else syncViewUI();
  }, 160);
});

/* ---------------- 导入导出 ---------------- */
function download(name, content, type){
  const blob = new Blob([content], {type:type||"application/json;charset=utf-8"});
  const a = document.createElement("a");
  a.href = URL.createObjectURL(blob);
  a.download = name;
  document.body.appendChild(a); a.click();
  setTimeout(()=>{ URL.revokeObjectURL(a.href); a.remove(); }, 400);
}
function exportJSON(){
  download("news-hub-backup-"+todayStr()+".json",
    JSON.stringify({app:"news-hub", version:DATA_VERSION, exportedAt:new Date().toISOString(), items:ITEMS, state:STATE}, null, 2));
  toast("已导出 " + ITEMS.length + " 条数据");
}
function exportCSV(){
  const head = ["抓取日期","话题","分类","标题","摘要","来源","发布时间","原文链接"];
  const rows = ITEMS.slice().sort((a,b)=>a.date<b.date?1:-1).map(i=>[
    i.date, (TOPICS[i.topic]||{}).short||i.topic, i.cat||"", i.title||"", i.summary||"", i.source||"", i.pubDate||"", i.url||""
  ]);
  const csv = [head].concat(rows).map(r=>r.map(c=>'"'+String(c).replace(/"/g,'""')+'"').join(",")).join("\r\n");
  download("news-hub-"+todayStr()+".csv", "\ufeff"+csv, "text/csv;charset=utf-8");
  toast("已导出 CSV");
}
const fileIn = document.getElementById("fileIn");
fileIn.addEventListener("change", ()=>{
  const f = fileIn.files[0]; if(!f) return;
  const r = new FileReader();
  r.onload = ()=>{
    try{
      const data = JSON.parse(r.result);
      const incoming = Array.isArray(data) ? data : (data.items||[]);
      if(!incoming.length) { toast("文件里没有可导入的数据"); return; }
      const map = new Map();
      ITEMS.forEach(i=>map.set(i.id, i));
      let added = 0;
      incoming.forEach(i=>{ if(i && i.id && !map.has(i.id)){ map.set(i.id, i); added++; } });
      ITEMS = Array.from(map.values());
      if(data.state){
        Object.assign(STATE.read, data.state.read||{});
        Object.assign(STATE.star, data.state.star||{});
      }
      saveItems(ITEMS); saveState(); renderAll();
      toast("导入完成，新增 " + added + " 条，当前共 " + ITEMS.length + " 条");
    }catch(err){ toast("导入失败：文件格式不正确"); }
    fileIn.value = "";
  };
  r.readAsText(f);
});

function handleAction(act){
  switch(act){
    case "export-json": exportJSON(); break;
    case "export-csv": exportCSV(); break;
    case "import": fileIn.click(); break;
    case "readall":
      ITEMS.forEach(i=>STATE.read[i.id]=1); saveState(); renderAll(); toast("已全部标记为已读"); break;
    case "readnone":
      STATE.read = {}; saveState(); renderAll(); toast("已全部标记为未读"); break;
    case "clear":
      if(confirm("确定清空全部 " + ITEMS.length + " 条新闻数据？\n此操作不可撤销，建议先导出备份。")){
        ITEMS = []; STATE = {read:{}, star:{}};
        saveItems(ITEMS); saveState(); renderAll(); toast("数据已清空");
      }
      break;
  }
}

/* ---------------- 启动 ---------------- */
(function init(){
  syncViewUI();
  const d = new Date();
  document.getElementById("syncTxt").textContent = "本地存储 · " + String(d.getHours()).padStart(2,"0") + ":" + String(d.getMinutes()).padStart(2,"0");
  renderAll();
})();
</script>
